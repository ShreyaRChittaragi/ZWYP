# Render Blueprint. Fill the two `sync: false` URLs in the dashboard after the first deploy.
services:
  - type: web
    name: zwyp-api
    runtime: python
    rootDir: backend
    plan: starter            # persistent disks need a paid plan; see README "Deploying to Render"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    disk:
      name: zwyp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ZWYP_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/zwyp.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: FRONTEND_URL
        sync: false          # e.g. https://zwyp-web.onrender.com

  - type: web
    name: zwyp-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:                  # SPA fallback so React Router deep links / refreshes work
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://zwyp-api.onrender.com  (no trailing slash, no /api)